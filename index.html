<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
    <!-- resizes-content: the on-screen keyboard shrinks the page instead of covering its bottom (view/Outline.tsx). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>Listik</title>
    <script>
      {
      // The theme before the first paint, so the page never flashes the other one (see src/view/theme.ts):
      // the system's, dark if it tells none; a pick in the menu while the system is as it was then.
      const system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = system;
      try {
        const theme = localStorage.getItem('listik-theme');
        if ((theme === 'light' || theme === 'dark') && localStorage.getItem('listik-theme-system') === system) document.documentElement.dataset.theme = theme;
        // And the text size (src/view/textsize.ts), so the outline does not jump.
        const scale = localStorage.getItem('listik-text-scale');
        if (scale) document.documentElement.style.setProperty('--font-scale', scale);
      } catch {}
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
