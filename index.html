<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
    <!-- resizes-content: the on-screen keyboard shrinks the page instead of covering its bottom (view/Outline.tsx). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>Listik</title>
    <!-- listik-theme-bootstrap -->
    <script type="module" src="/src/view/theme.ts"></script>
    <script>
      try {
        const scale = localStorage.getItem('listik-text-scale');
        if (scale) document.documentElement.style.setProperty('--font-scale', scale);
        const font = localStorage.getItem('listik-font');
        if (font) document.documentElement.style.setProperty('--font-text', font);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
